<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sổ tay 750 prompt AI cho lãnh đạo, cán bộ, công chức Đảng ủy, chính quyền, Mặt trận và đoàn thể cấp xã. Biên soạn: TS. Hoàng Thanh Nghị.">
<meta name="author" content="TS. Hoàng Thanh Nghị">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sổ tay 750 Prompt Cấp xã</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
/* Bố cục ứng dụng: thanh trên mực đậm; thanh bên (hồ sơ + lĩnh vực) và vùng nội dung; khung soạn prompt trượt từ phải. Màu khối: Đảng đỏ son, Chính quyền xanh lam, Mặt trận nâu đất, Dùng chung xanh rêu */
:root{
  --paper:#F1F3F0; --surface:#FFFFFF; --sunk:#F6F7F4; --ink:#15223A; --muted:#5A6373; --line:#D8DDD7; --line-strong:#B9C0B8;
  --bar:#15223A; --bar-fg:#F1F3F0; --bar-muted:#A8B3C2; --bar-field:#22314C;
  --seal:#A3261C; --seal-hover:#8B1F17; --on-seal:#FFFFFF; --seal-soft:#F6E4E1;
  --dang:#A3261C; --dang-soft:#F6E4E1; --cq:#1F4F8A; --cq-soft:#E3EBF5; --mt:#85570F; --mt-soft:#F3EADB; --chung:#3D5A4C; --chung-soft:#E2ECE6;
  --ok:#2E6B4A; --ok-soft:#E0EFE6; --warn:#8A5A00; --warn-soft:#FBEFD4;
  --mark-bg:#FFEDB8; --mark-fg:#5E4100; --sys-fg:#6E7787;
  --shadow:0 18px 50px -20px rgba(16,24,40,.45);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E141C; --surface:#161E29; --sunk:#111821; --ink:#E6E9ED; --muted:#9AA4B2; --line:#283241; --line-strong:#3A4658;
  --bar:#0A0F15; --bar-fg:#EEF0F2; --bar-muted:#8995A6; --bar-field:#18212D;
  --seal:#E2766A; --seal-hover:#EC8F84; --on-seal:#1B0E0C; --seal-soft:#3A1F1C;
  --dang:#E8877C; --dang-soft:#3A1F1D; --cq:#86ADE6; --cq-soft:#1B2A40; --mt:#DDA95E; --mt-soft:#33281A; --chung:#8FC2A6; --chung-soft:#1C2E25;
  --ok:#86C9A2; --ok-soft:#173025; --warn:#E5BC6A; --warn-soft:#352A14;
  --mark-bg:#3D3216; --mark-fg:#F2D584; --sys-fg:#8691A1; --shadow:0 18px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E141C; --surface:#161E29; --sunk:#111821; --ink:#E6E9ED; --muted:#9AA4B2; --line:#283241; --line-strong:#3A4658;
  --bar:#0A0F15; --bar-fg:#EEF0F2; --bar-muted:#8995A6; --bar-field:#18212D;
  --seal:#E2766A; --seal-hover:#EC8F84; --on-seal:#1B0E0C; --seal-soft:#3A1F1C;
  --dang:#E8877C; --dang-soft:#3A1F1D; --cq:#86ADE6; --cq-soft:#1B2A40; --mt:#DDA95E; --mt-soft:#33281A; --chung:#8FC2A6; --chung-soft:#1C2E25;
  --ok:#86C9A2; --ok-soft:#173025; --warn:#E5BC6A; --warn-soft:#352A14;
  --mark-bg:#3D3216; --mark-fg:#F2D584; --sys-fg:#8691A1; --shadow:0 18px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 2px}
.sys{color:var(--sys-fg);font-style:italic}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Thanh ứng dụng */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-fg);border-bottom:3px solid var(--seal)}
.appbar .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left;min-width:0}
.logo{width:40px;height:40px;border-radius:8px;background:var(--seal);color:var(--on-seal);display:grid;place-items:center;font:700 14px/1 var(--f-display);flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.15;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--bar-muted);white-space:nowrap}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--bar-muted)}
.search input{width:100%;background:var(--bar-field);border:1px solid transparent;border-radius:8px;padding:10px 12px 10px 40px;color:var(--bar-fg)}
.search input::placeholder{color:var(--bar-muted)}
.search input:focus{outline:none;border-color:var(--seal)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 11px var(--f-mono);color:var(--bar-muted);border:1px solid var(--bar-muted);border-radius:4px;padding:1px 6px}
.barbtn{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--bar-fg);border-radius:8px;padding:8px 12px;white-space:nowrap;font-size:14px}
.barbtn:hover{border-color:var(--bar-fg)}
.barbtn .n{background:var(--seal);color:var(--on-seal);border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
.only-m{display:none}

/* Khung chính */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;padding-block:20px 40px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 96px);overflow:auto;display:grid;gap:14px;padding-bottom:6px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.pcard .lab{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pcard .unit{font-weight:600;margin:4px 0 2px;line-height:1.35}
.pcard .pos{font-size:13.5px;color:var(--muted);line-height:1.4}
.pcard .act{margin-top:10px;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line-strong);background:var(--surface)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.btn.pri:hover{background:var(--seal-hover);border-color:var(--seal-hover)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.nav{display:grid;gap:2px}
.navh{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px 4px;display:flex;align-items:center;gap:8px}
.navi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left;font-size:14px;line-height:1.3}
.navi:hover{background:var(--surface)}
.navi[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.navi .c{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.sw.g-dang{background:var(--dang)} .sw.g-cq{background:var(--cq)} .sw.g-mt{background:var(--mt)} .sw.g-chung{background:var(--chung)}
.side details summary{list-style:none;cursor:pointer}
.side details summary::-webkit-details-marker{display:none}
.side details[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

/* Nội dung */
.main{min-width:0}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--seal);text-decoration:underline;text-underline-offset:3px}
.phead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between;margin:6px 0 16px}
.phead h1{font-size:clamp(24px,3vw,32px);line-height:1.15}
.phead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.welcome h1{font-size:clamp(24px,3vw,32px);line-height:1.15}
.welcome .by{margin:8px 0 0;color:var(--muted);font-size:14px}
.welcome .by b{color:var(--ink)}
.welcome p.lead{margin:12px 0 16px;max-width:62ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;align-content:start}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;font-size:14px}
.steps .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 12px var(--f-mono)}
.sect{margin:6px 0 10px;display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;min-height:74px}
.tile:hover{border-color:var(--line-strong);box-shadow:0 6px 18px -12px rgba(0,0,0,.35)}
.tile .ic{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:600 12px var(--f-mono)}
.ic.g-dang{background:var(--dang-soft);color:var(--dang)} .ic.g-cq{background:var(--cq-soft);color:var(--cq)} .ic.g-mt{background:var(--mt-soft);color:var(--mt)} .ic.g-chung{background:var(--chung-soft);color:var(--chung)}
.tile b{font-weight:600;font-size:14.5px;line-height:1.3}
.tile .c{font:500 12px var(--f-mono);color:var(--muted)}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row:hover{border-color:var(--line-strong)}
.row .open{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;padding:12px 14px;text-align:left;border-radius:10px 0 0 10px;min-width:0}
.row .code{font:500 12px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.row .t{font-weight:600;font-size:15px;line-height:1.35;display:block}
.row .d{display:block;color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .go{color:var(--seal);font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px}
.row .star{border:0;border-left:1px solid var(--line);background:none;padding:0 14px;color:var(--muted);border-radius:0 10px 10px 0}
.row .star[aria-pressed="true"]{color:var(--seal)}
.row .star[aria-pressed="true"] svg{fill:currentColor}
.tag{font-size:11.5px;border-radius:4px;padding:1px 7px;font-weight:600;white-space:nowrap}
.tag.out{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.more{display:flex;justify-content:center;margin:14px 0}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:10px;padding:22px;color:var(--muted)}
.basis{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:14px}
.basis summary{cursor:pointer;font-weight:600}
.basis ol{margin:12px 0 6px;padding-left:20px;display:grid;gap:8px;max-width:95ch}
.basis p{color:var(--muted);font-size:13.5px;margin:6px 0 0;max-width:95ch}
.foot{margin-top:18px;color:var(--muted);font-size:13px}

/* Lớp phủ, khung soạn, hộp thoại */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:40}
.composer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);z-index:50;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.chead{background:var(--surface);border-bottom:1px solid var(--line);padding-block:14px 12px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:20px}
.chead .top{display:flex;align-items:center;gap:10px}
.chead .code{font:500 12.5px var(--f-mono);color:var(--muted)}
.chip{font-size:12px;border-radius:4px;padding:2px 8px;font-weight:600}
.chip.g-dang{background:var(--dang-soft);color:var(--dang)} .chip.g-cq{background:var(--cq-soft);color:var(--cq)} .chip.g-mt{background:var(--mt-soft);color:var(--mt)} .chip.g-chung{background:var(--chung-soft);color:var(--chung)}
.x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center}
.chead h2{font-size:22px;line-height:1.25;margin-top:8px}
.chead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.cbody{flex:1;overflow:auto;padding-block:16px 24px;padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px;align-content:start}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.blk h3{font-family:var(--f-body);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.blk h3 .step{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 11px var(--f-mono);letter-spacing:0}
.fld{display:grid;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}
.fld:first-of-type{border-top:0;padding-top:0}
.fld label{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.auto{font-size:11px;font-weight:600;background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:1px 6px}
.input,.textarea,select.input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.input:focus,.textarea:focus{outline:none;border-color:var(--seal);background:var(--surface)}
.input.filled{background:var(--surface)}
.textarea{min-height:120px;resize:vertical;font:13.5px/1.55 var(--f-body)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px}
.chips button:hover{border-color:var(--seal);color:var(--seal)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.nofld{color:var(--muted);font-size:14px;margin:0}
.preview{white-space:pre-wrap;word-wrap:break-word;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;font:13px/1.6 var(--f-body);max-height:360px;overflow:auto}
.cfoot{background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.cfoot .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px}
.pill.w{background:var(--warn-soft);color:var(--warn)} .pill.g{background:var(--ok-soft);color:var(--ok)}
.cfoot .r1 .sp{flex:1}
.ai{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.ai a{color:var(--seal);font-weight:600;text-decoration:none}
.ai a:hover{text-decoration:underline}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.mhead{background:var(--bar);color:var(--bar-fg);padding:18px 20px;border-bottom:3px solid var(--seal)}
.mhead h2{font-size:21px}
.mhead p{margin:6px 0 0;color:var(--bar-muted);font-size:13.5px}
.mbody{overflow:auto;padding:16px 20px;display:grid;gap:14px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.posg{display:grid;gap:6px;margin-top:10px}
.posg .kh{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:flex;gap:8px;align-items:center}
.k-dang{color:var(--dang)} .k-cq{color:var(--cq)} .k-mt{color:var(--mt)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;text-align:left;line-height:1.35;font-size:13.5px}
.opt:hover{border-color:var(--line-strong)}
.opt[aria-pressed="true"]{color:var(--surface);font-weight:600}
.opt[aria-pressed="true"].g-dang{background:var(--dang);border-color:var(--dang)}
.opt[aria-pressed="true"].g-cq{background:var(--cq);border-color:var(--cq)}
.opt[aria-pressed="true"].g-mt{background:var(--mt);border-color:var(--mt)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.lbl small{font-weight:400;color:var(--muted)}
.unitprev{background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;top:0;left:0;bottom:0;width:min(330px,88%);max-height:none;background:var(--paper);padding:calc(14px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none}
  .only-m{display:flex}
  .welcome{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:680px){
  .appbar .in{flex-wrap:wrap;gap:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  .kbd,.hide-s{display:none}
  .brand small{display:none}

 '<li><b>Mặt trận, đoàn thể:</b> các Quyết định số 4250, 4251, 4252, 4254, 4260 và 4262-QĐ/BTCTW về danh mục vị trí việc làm công chức Cơ quan Ủy ban MTTQ Việt Nam, Công đoàn, Hội Nông dân, Hội Liên hiệp Phụ nữ, Hội Cựu chiến binh, Đoàn TNCS Hồ Chí Minh.</li></ol>'+
 '<p>Danh mục được gom theo cơ quan, tổ chức để tra cứu nhanh; không thay thế đề án vị trí việc làm do cấp có thẩm quyền phê duyệt. Trước khi trích dẫn chính thức, đề nghị đối chiếu văn bản gốc còn hiệu lực.</p></details>'+
 '<p class="foot">Sổ tay 750 prompt AI · TS. Hoàng Thanh Nghị, Phó Hiệu trưởng Trường Cao đẳng Điện Biên biên soạn. Tài liệu tham khảo, phi thương mại. Hồ sơ đơn vị, prompt đã lưu và nội dung đã điền chỉ lưu trên trình duyệt của bạn; tài liệu dán vào không được lưu lại.</p>';
}
function renderMain(){
 var pos=curPos(),mine=myDomains(),h="";
 var q=V.q.trim();
 if(q){
  var qs=norm(q).split(" ");
  var res=ITEMS.filter(function(it){return qs.every(function(w){return it.key.indexOf(w)>=0;});});
  if(mine)res.sort(function(a,b){return (mine.indexOf(a.code)<0)-(mine.indexOf(b.code)<0);});
  h+='<div class="crumbs"><button type="button" data-act="home">Trang chủ</button><span>›</span><span>Tìm kiếm</span></div>';
  h+='<div class="phead"><div><h1>Kết quả cho “'+esc(q)+'”</h1><p>'+res.length+' prompt'+(mine?'. Prompt thuộc vị trí của bạn được xếp lên trước.':'.')+'</p></div></div>';
  h+=listHTML(res,mine);
 }else if(V.view==="domain"&&V.dom){
  var d=DOM[V.dom],list=ITEMS.filter(function(it){return it.code===V.dom;});
  h+='<div class="crumbs"><button type="button" data-act="home">'+(pos?"Lĩnh vực của tôi":"Trang chủ")+'</button><span>›</span><span>'+GROUP[d.g].name+'</span></div>';
  h+='<div class="phead"><div><h1>'+esc(d.name)+'</h1><p>25 prompt · bấm một việc để mở khung soạn, các ô thời gian và đơn vị đã được điền sẵn.</p></div></div>';
  h+=listHTML(list,null);
 }else if(V.view==="saved"){
  var sl=ITEMS.filter(function(it){return saved[it.id];});
  h+='<div class="crumbs"><button type="button" data-act="home">Trang chủ</button><span>›</span><span>Đã lưu</span></div>';
  h+='<div class="phead"><div><h1>Prompt đã lưu</h1><p>Bấm biểu tượng ngôi sao ở mỗi prompt để lưu dùng lại.</p></div></div>';
  h+=sl.length?listHTML(sl,mine):'<div class="empty">Chưa có prompt nào được lưu.</div>';
 }else{
  h+='<section class="welcome"><div><h1>'+(pos?"Xin chào, "+esc(whoLine()):"Sổ tay 750 prompt AI cho công vụ cấp xã")+'</h1>'+
   '<p class="by">Biên soạn: <b>TS. Hoàng Thanh Nghị</b> · Phó Hiệu trưởng Trường Cao đẳng Điện Biên</p>'+
   '<p class="lead">750 prompt dựng sẵn cho lãnh đạo, công chức Đảng ủy, chính quyền, Mặt trận và đoàn thể xã, phường, đặc khu. Mỗi prompt yêu cầu AI chỉ dùng tài liệu bạn cung cấp, không tự bịa căn cứ pháp lý, đánh dấu chỗ thiếu dữ liệu.</p>'+
   (pos?'<button type="button" class="btn" data-act="profile">Sửa hồ sơ đơn vị</button>':'<button type="button" class="btn pri" data-act="profile">Thiết lập hồ sơ đơn vị (1 phút)</button>')+
   '</div><ol class="steps"><li><span class="n">1</span><span><b>Thiết lập hồ sơ</b> một lần: vai trò, vị trí, tên xã/phường. Prompt sẽ tự điền.</span></li><li><span class="n">2</span><span><b>Chọn việc cần làm</b> theo lĩnh vực hoặc gõ vào ô tìm kiếm.</span></li><li><span class="n">3</span><span><b>Điền nốt các ô</b> còn trống, dán tài liệu, bấm <b>Sao chép</b> rồi dán vào công cụ AI.</span></li><li><span class="n">!</span><span>Không dán tài liệu mật; thay họ tên, số định danh của công dân bằng mã. Luôn kiểm tra kết quả AI trước khi dùng.</span></li></ol></section>';
  if(mine){
   h+='<div class="sect">Lĩnh vực chuyên môn của bạn</div><div class="tiles">'+pos.d.map(tile).join("")+'</div>';
   h+='<div class="sect">Dùng chung cho mọi vị trí</div><div class="tiles">'+GENERAL.map(tile).join("")+'</div>';
   h+='<div class="sect">Lĩnh vực khác</div><div class="tiles">'+ORDER.filter(function(c){return mine.indexOf(c)<0;}).map(tile).join("")+'</div>';
  }else{
   ["chung","dang","cq","mt"].forEach(function(g){h+='<div class="sect"><span class="sw '+GROUP[g].cls+'"></span>'+GROUP[g].name+'</div><div class="tiles">'+ORDER.filter(function(c){return DOM[c].g===g;}).map(tile).join("")+'</div>';});
  }
 }
 h+=basisHTML();
 $("main").innerHTML=h;
 $("savedN").textContent=Object.keys(saved).length;
}
function renderAll(){renderSide();renderMain();}
function go(view,dom){V.view=view;V.dom=dom||null;V.limit=40;if(V.q){V.q="";$("q").value="";}closeSide();renderAll();window.scrollTo(0,0);}

/* ---------- Khung soạn prompt ---------- */
function openComposer(id){
 var it=BYID[id];if(!it)return;
 var dr=drafts[id]||{};
 C={id:id,vals:{},edited:{},doc:""};
 fieldsOf(rawPrompt(it)).forEach(function(f){
  if(dr[f.key]!=null&&dr[f.key]!==""){C.vals[f.key]=dr[f.key];C.edited[f.key]=1;}
  else C.vals[f.key]=autoValue(f.key,f.before);
 });
 renderComposer();show("composer");
 setTimeout(function(){var f=$("composer").querySelector("input.input:not(.filled)")||$("cCopy");if(f)f.focus();},60);
}
function renderComposer(){
 var it=BYID[C.id],raw=rawPrompt(it),fs=fieldsOf(raw),g=GROUP[it.g],h="";
 h+='<div class="chead"><div class="top"><span class="code">'+it.id+'</span><span class="chip '+g.cls+'">'+esc(it.dname)+'</span><button type="button" class="x" data-act="close" aria-label="Đóng">'+ICON.x+'</button></div>';
 h+='<h2 id="cTitle">'+esc(it.title)+'</h2><p>'+hi(it.desc)+'</p></div>';
 h+='<div class="cbody">';
 h+='<div class="blk"><h3><span class="step">1</span>Điền thông tin</h3>';
 if(!fs.length)h+='<p class="nofld">Prompt này không có ô cần điền.</p>';
 fs.forEach(function(f,i){
  var v=C.vals[f.key]||"",auto=!C.edited[f.key]&&v,chips=chipsFor(f.key);
  h+='<div class="fld"><label for="f'+i+'">'+esc(labelOf(f.key))+(auto?' <span class="auto">Tự điền</span>':'')+'</label>'+
   '<input class="input'+(v?" filled":"")+'" id="f'+i+'" data-key="'+esc(f.key)+'" value="'+esc(v)+'" placeholder="'+esc(f.key)+'" autocomplete="off">'+
   (chips.length?'<div class="chips">'+chips.map(function(c){return '<button type="button" data-chip="'+i+'" data-v="'+esc(c)+'">'+esc(c)+'</button>';}).join("")+'</div>':'')+'</div>';
 });
 if(!unitName())h+='<p class="note">Mẹo: <button type="button" class="btn sm" data-act="profile">Thiết lập hồ sơ đơn vị</button> để các prompt sau tự điền tên đơn vị, bộ phận.</p>';
 h+='</div>';
 h+='<div class="blk"><h3><span class="step">2</span>Tài liệu kèm theo <small style="text-transform:none;letter-spacing:0;font-weight:400">(tùy chọn)</small></h3>'+
  '<textarea class="textarea" id="fDoc" placeholder="Dán văn bản chỉ đạo, số liệu, ghi chép... vào đây để prompt sao chép ra là dùng được ngay.">'+esc(C.doc)+'</textarea>'+
  '<p class="note">Nội dung này không được lưu lại. Không dán tài liệu mật; thay họ tên, số định danh, địa chỉ của công dân bằng mã.</p></div>';
 h+='<div class="blk"><h3><span class="step">3</span>Xem trước prompt</h3><pre class="preview" id="cPrev"></pre></div>';
 h+='</div>';
 h+='<div class="cfoot"><div class="r1"><span id="cLeft"></span><span class="sp"></span>'+
  '<button type="button" class="btn" data-star="'+it.id+'" id="cStar" aria-pressed="'+(!!saved[it.id])+'">'+ICON.star+'<span>'+(saved[it.id]?"Đã lưu":"Lưu")+'</span></button>'+
  '<button type="button" class="btn pri" id="cCopy" data-act="copy">'+ICON.copy+'<span>Sao chép prompt</span></button></div>'+
  '<div class="ai">Sau khi sao chép, mở công cụ AI: '+AI_LINKS.map(function(a){return '<a href="'+a[1]+'" target="_blank" rel="noopener">'+a[0]+'</a>';}).join("")+'</div></div>';
 $("composer").innerHTML=h;updatePreview();
}
function updatePreview(){
 var it=BYID[C.id],txt=finalPrompt(it,C.vals,C.doc);
 $("cPrev").innerHTML=hi(txt);
 var left=fieldsOf(rawPrompt(it)).filter(function(f){return !(C.vals[f.key]&&String(C.vals[f.key]).trim());}).length;
 $("cLeft").innerHTML=left?'<span class="pill w">Còn '+left+' ô chưa điền</span>':'<span class="pill g">Đã điền đủ các ô</span>';
}
function persistDraft(){var d={};Object.keys(C.edited).forEach(function(k){if(C.vals[k])d[k]=C.vals[k];});if(Object.keys(d).length)drafts[C.id]=d;else delete drafts[C.id];save("stp2-drafts",drafts);}

/* ---------- Hồ sơ đơn vị (hộp thoại) ---------- */
var T=null;
function openProfile(){T=JSON.parse(JSON.stringify(P));T._coquanEdited=!!P.coquan;renderProfile();show("modal");}
function renderProfile(){
 var h='<div class="mhead"><h2 id="mTitle">Hồ sơ đơn vị</h2><p>Thiết lập một lần. Thông tin chỉ lưu trên trình duyệt này và được tự điền vào mọi prompt.</p></div><div class="mbody">';
 h+='<div><span class="lbl">1. Vai trò</span><div class="seg">'+[["lanhdao","Lãnh đạo"],["chuyenvien","Chuyên viên"]].map(function(r){return '<button type="button" data-prole="'+r[0]+'" aria-pressed="'+(T.role===r[0])+'">'+r[1]+'</button>';}).join("")+'</div></div>';
 h+='<div><span class="lbl">2. Vị trí công tác</span>';
 if(!T.role)h+='<p class="note">Chọn vai trò để hiện danh sách vị trí.</p>';
 else["dang","cq","mt"].forEach(function(k){var l=POS[T.role].filter(function(p){return p.k===k;});if(!l.length)return;
  h+='<div class="posg"><div class="kh k-'+k+'"><span class="sw '+GROUP[k].cls+'"></span>'+GROUP[k].name+'</div><div class="opts">'+l.map(function(p){return '<button type="button" class="opt '+GROUP[k].cls+'" data-ppos="'+p.id+'" aria-pressed="'+(T.pos===p.id)+'">'+esc(p.label)+'</button>';}).join("")+'</div></div>';});
 h+='</div>';
 h+='<div><span class="lbl">3. Địa bàn</span><div class="seg" style="margin-bottom:10px">'+["xã","phường","đặc khu"].map(function(l){return '<button type="button" data-ploai="'+l+'" aria-pressed="'+(T.loai===l)+'">'+l.charAt(0).toUpperCase()+l.slice(1)+'</button>';}).join("")+'</div>'+
  '<div class="grid2"><div><label class="lbl" for="pTen">Tên '+esc(T.loai)+'</label><input class="input" id="pTen" data-pf="ten" value="'+esc(T.ten)+'" placeholder="Nhập tên '+esc(T.loai)+'" autocomplete="off"></div>'+
  '<div><label class="lbl" for="pTinh">Tỉnh, thành phố</label><input class="input" id="pTinh" data-pf="tinh" value="'+esc(T.tinh)+'" placeholder="VD: tỉnh Điện Biên" autocomplete="off"></div></div></div>';
 h+='<div><label class="lbl" for="pCq">Tên cơ quan điền vào prompt <small>(tự ghép, sửa nếu cần)</small></label><input class="input" id="pCq" data-pf="coquan" value="'+esc(T._coquanEdited?T.coquan:composeUnit(T))+'" placeholder="Tự ghép khi có tên xã/phường" autocomplete="off"></div>';
 h+='<div><span class="lbl">4. Tùy chọn thêm</span><div class="grid2">'+
  '<div><label class="lbl" for="pCd">Chức danh của bạn <small>(không bắt buộc)</small></label><input class="input" id="pCd" data-pf="chucdanh" value="'+esc(T.chucdanh)+'" placeholder="VD: Phó Chủ tịch UBND xã" autocomplete="off"></div>'+
  '<div><label class="lbl" for="pDt">Dân tộc chủ yếu trên địa bàn</label><input class="input" id="pDt" data-pf="dantoc" value="'+esc(T.dantoc)+'" placeholder="VD: Thái, Mông" autocomplete="off"></div>'+
  '<div><label class="lbl" for="pLen">Độ dài mặc định (số chữ)</label><input class="input" id="pLen" data-pf="dodai" inputmode="numeric" value="'+esc(T.dodai)+'" autocomplete="off"></div></div></div>';
 h+='</div><div class="mfoot"><button type="button" class="btn" data-act="mclose">Để sau</button><button type="button" class="btn pri" data-act="msave">Lưu hồ sơ</button></div>';
 $("modal").innerHTML=h;
}

/* ---------- Mở/đóng lớp phủ ---------- */
var lastFocus=null;
function show(id){lastFocus=document.activeElement;$(id).hidden=false;$("scrim").hidden=false;document.body.style.overflow="hidden";}
function hideAll(){["composer","modal"].forEach(function(id){$(id).hidden=true;});closeSide();$("scrim").hidden=true;document.body.style.overflow="";C=null;if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
function openSide(){$("side").classList.add("open");$("scrim").hidden=false;}
function closeSide(){$("side").classList.remove("open");if($("composer").hidden&&$("modal").hidden)$("scrim").hidden=true;}

/* ---------- Sao chép ---------- */
var toastT;
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function copyText(txt,done,fail){
 function fb(){var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";ta.style.top="0";ta.style.left="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);ok?done():fail();}
 try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb();}catch(e){fb();}
}
function doCopy(){
 var it=BYID[C.id],txt=finalPrompt(it,C.vals,C.doc),btn=$("cCopy");
 copyText(txt,function(){btn.querySelector("span").textContent="Đã sao chép";toast("Đã sao chép prompt "+it.id+". Dán vào công cụ AI để dùng.");setTimeout(function(){if($("cCopy"))$("cCopy").querySelector("span").textContent="Sao chép prompt";},1800);},
  function(){var pre=$("cPrev"),r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);pre.scrollIntoView({block:"nearest"});toast("Trình duyệt chặn sao chép tự động. Prompt đã được bôi đen, hãy nhấn Ctrl+C (hoặc giữ để sao chép trên điện thoại).");});
}
function toggleStar(id){if(saved[id])delete saved[id];else saved[id]=1;save("stp-saved",Object.keys(saved));
 document.querySelectorAll('[data-star="'+id+'"]').forEach(function(b){b.setAttribute("aria-pressed",!!saved[id]);var s=b.querySelector("span");if(s)s.textContent=saved[id]?"Đã lưu":"Lưu";});
 $("savedN").textContent=Object.keys(saved).length;toast(saved[id]?"Đã lưu "+id+" vào danh sách.":"Đã bỏ lưu "+id+".");
 renderSide();if(V.view==="saved"&&$("composer").hidden)renderMain();}

/* ---------- Sự kiện ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var a=b.dataset;
 if(a.open){openComposer(a.open);return;}
 if(a.star){toggleStar(a.star);return;}
 if(a.dom){go("domain",a.dom);return;}
 if(a.chip!=null){var inp=$("f"+a.chip);inp.value=a.v;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.focus();return;}
 if(a.prole){T.role=a.prole;T.pos=null;renderProfile();return;}
 if(a.ppos){T.pos=a.ppos;if(!T._coquanEdited)T.coquan="";renderProfile();return;}
 if(a.ploai){T.loai=a.ploai;renderProfile();return;}
 switch(a.act){
  case"home":go("home");break;
  case"saved":go("saved");break;
  case"profile":hideAll();openProfile();break;
  case"close":case"mclose":save("stp2-seen",1);hideAll();break;
  case"copy":doCopy();break;
  case"more":V.limit+=40;renderMain();break;
  case"msave":
   var cq=$("pCq").value.trim();T.coquan=(cq&&cq!==composeUnit(T))?cq:"";delete T._coquanEdited;
   T.dodai=String(parseInt(T.dodai,10)||800);P=T;save("stp2-profile",P);save("stp2-seen",1);hideAll();renderAll();toast("Đã lưu hồ sơ đơn vị. Các prompt sẽ tự điền theo hồ sơ này.");break;
 }
});
$("homeBtn").addEventListener("click",function(){go("home");});
$("savedBtn").addEventListener("click",function(){go("saved");});
$("profileBtn").addEventListener("click",function(){openProfile();});
$("menuBtn").addEventListener("click",openSide);
$("scrim").addEventListener("click",function(){if(!$("modal").hidden)save("stp2-seen",1);hideAll();});
document.addEventListener("input",function(e){
 var t=e.target;
 if(C&&t.dataset&&t.dataset.key!=null){var k=t.dataset.key;C.vals[k]=t.value;C.edited[k]=1;t.classList.toggle("filled",!!t.value);var lab=t.parentNode.querySelector(".auto");if(lab)lab.remove();persistDraft();updatePreview();return;}
 if(C&&t.id==="fDoc"){C.doc=t.value;updatePreview();return;}
 if(T&&t.dataset&&t.dataset.pf){var f=t.dataset.pf;T[f]=t.value;
  if(f==="coquan"){T._coquanEdited=!!t.value&&t.value!==composeUnit(T);}
  else if(f==="ten"||f==="tinh"){if(!T._coquanEdited)$("pCq").value=composeUnit(T);}
 }
});
var qt;$("q").addEventListener("input",function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){V.q=v;V.limit=40;renderMain();},150);});
document.addEventListener("keydown",function(e){
 if(e.key==="Escape"&&(!$("composer").hidden||!$("modal").hidden||$("side").classList.contains("open"))){save("stp2-seen",1);hideAll();}
 if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus();}
});

/* ---------- Khởi động ---------- */
renderAll();
var hash=(location.hash||"").slice(1).toUpperCase();
if(BYID[hash])openComposer(hash);
else if(!load("stp2-seen")&&!curPos())openProfile();
})();

</script>
</body>
